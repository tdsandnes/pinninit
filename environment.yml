name: pinninit
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Core Python
  - python=3.11

  # Scientific Python Packages
  - matplotlib
  - numpy
  - scipy
  - h5py
  - colorcet

  # PyTorch and CUDA
  - pytorch
  - pytorch-cuda=12.4

  # YAML support
  - pyyaml

  # Development tools
  - pre-commit
  - pytest
