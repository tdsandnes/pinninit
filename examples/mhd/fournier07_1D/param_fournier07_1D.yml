model_name: fournier07_1D

DataSets:
  data_sets:
    - data_set_label: data_loss
      from_file:      1
      file_path:      ./data/fournier07_1D_train_val.hdf5
      sampling:       none
    - data_set_label: data_bc_loss
      from_file:      1
      file_path:      ./data/fournier07_1D_train_val.hdf5
      sampling:       none
    - data_set_label: phys_momentum_loss
      from_file:      1
      file_path:      ./data/fournier07_1D_train_val.hdf5
      sampling:       none
    - data_set_label: phys_induction_loss
      from_file:      1
      file_path:      ./data/fournier07_1D_train_val.hdf5
      sampling:       none

Coordinates:
  coordinate_system:  cartesian
  coordinates:
    - label: t
      is_geometric: 0
    - label: x
      is_geometric: 1
  domains:
    - domain_label: data_domain
      coordinates:
        - label: t
          min: 0.0
          max: 0.2
        - label: x
          min: -1.0
          max: 1.0
    - domain_label: full_domain
      coordinates:
        - label: t
          min: 0.0
          max: 0.2
        - label: x
          min: -1.0
          max: 1.0

Fields:
  input_fields:
    - label: b
      rank: 0
    - label: u
      rank: 0
  output_fields:
    - label: b
      rank: 0
    - label: u
      rank: 0
  derivable_fields:
    - label: momentum_residual
      rank: 0
    - label: induction_residual
      rank: 0

Equations:
  equations:
    - label: momentum_eqn
      function_name: momentum_eqn
      file_path: ./fournier07_1D_equations.py
      input_args:
        - b
        - u
      output_args:
        - momentum_residual
    - label: induction_eqn
      function_name: induction_eqn
      file_path: ./fournier07_1D_equations.py
      input_args:
        - b
        - u
      output_args:
        - induction_residual

LossTerms:
  terms:
    - loss_term_label:  data
      field_label:      b
      data_set_label:   data_loss
      domain_label:     data_domain
      loss_type:        data
      loss_function:    mse
      weight_method:    adaptive_grad_balance
      weight_value:     1.0
      weight_group:     data
    - loss_term_label:  bc_b
      field_label:      b
      data_set_label:   data_bc_loss
      domain_label:     full_domain
      loss_type:        data
      loss_function:    mse
      weight_method:    adaptive_grad_balance
      weight_value:     1.0
      weight_group:     bc_b
    - loss_term_label:  bc_u
      field_label:      u
      data_set_label:   data_bc_loss
      domain_label:     full_domain
      loss_type:        data
      loss_function:    mse
      weight_method:    adaptive_grad_balance
      weight_value:     1.0
      weight_group:     bc_u
    - loss_term_label:  momentum_eqn
      field_label:      momentum_residual
      data_set_label:   phys_momentum_loss
      domain_label:     full_domain
      loss_type:        physics
      loss_function:    mse
      weight_method:    adaptive_grad_balance
      weight_value:     1.0
      weight_group:     momentum_eqn
    - loss_term_label:  induction_eqn
      field_label:      induction_residual
      data_set_label:   phys_induction_loss
      domain_label:     full_domain
      loss_type:        physics
      loss_function:    mse
      weight_method:    adaptive_grad_balance
      weight_value:     1.0
      weight_group:     induction_eqn
  weight_methods:
    - label:                  adaptive_grad_balance
      alpha:                  0.1 # NOTE: outdated arxiv version of W+21 paper has incorrect value (0.9)
      update_frequency:       1000

Optimizer:
  optimizer:      soap
  learning_rate:  0.001

Layers:
  hidden_layer_widths:  [128, 128, 128] # [60, 60, 60, 60, 60, 60]
  layer_types:          siren
  activation_functions: siren
  init_weights:         siren
  init_biases:          all_zeros
