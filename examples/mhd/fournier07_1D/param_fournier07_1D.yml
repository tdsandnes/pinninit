model_name: fournier07_1D

CoordSystems:
  - label: cartesian_xt
    coord_system: cartesian
    geometric_axis_labels:
      - x
    non_geometric_axis_labels:
      - t

Coordinates:
  - label: data_coords
    coord_system_label: cartesian_xt
    domain:
      bounds:
        t:
          min: 0.0
          max: 0.2
          periodic: false
        x:
          min: -1.0
          max: 1.0
          periodic: false
  - label: full_coords
    coord_system_label: cartesian_xt
    domain:
      bounds:
        t:
          min: 0.0
          max: 0.2
          periodic: false
        x:
          min: -1.0
          max: 1.0
          periodic: false

DataSets:
  - label: dataset
    source: file
    file_path: ./data/fournier07_1D_train_val.hdf5
    sampling: none

Fields:
  input_fields:
    - label: b
      rank: 0
    - label: u
      rank: 0
  output_fields:
    - label: b
      rank: 0
    - label: u
      rank: 0
  derivable_fields:
    - label: momentum_residual
      rank: 0
    - label: induction_residual
      rank: 0

Equations:
  - label: momentum_eqn
    function_name: momentum_eqn
    file_path: ./fournier07_1D_equations.py
    input_labels: [b, u]
    output_labels: [momentum_residual]
    output_ranks: [0]
  - label: induction_eqn
    function_name: induction_eqn
    file_path: ./fournier07_1D_equations.py
    input_labels: [b, u]
    output_labels: [induction_residual]
    output_ranks: [0]

LossTerms:
  - label: data_b
    field_label: b
    coordinates_label: data_coords
    dataset_label: dataset
    loss_type: data
    loss_function: mse
    weight_method_label: adaptive_grad_balance
    weight_value: 1.0
    weight_group_label: data
  - label: bc_b
    field_label: b
    coordinates_label: full_coords
    dataset_label: dataset
    loss_type: data
    loss_function: mse
    weight_method_label: adaptive_grad_balance
    weight_value: 1.0
    weight_group_label: bc_b
  - label: bc_u
    field_label: u
    coordinates_label: full_coords
    dataset_label: dataset
    loss_type: data
    loss_function: mse
    weight_method_label: adaptive_grad_balance
    weight_value: 1.0
    weight_group_label: bc_u
  - label: momentum_eqn
    field_label: momentum_residual
    coordinates_label: full_coords
    dataset_label: dataset
    loss_type: physics
    loss_function: mse
    weight_method_label: adaptive_grad_balance
    weight_value: 1.0
    weight_group_label: momentum_eqn
  - label: induction_eqn
    field_label: induction_residual
    coordinates_label: full_coords
    dataset_label: dataset
    loss_type: physics
    loss_function: mse
    weight_method_label: adaptive_grad_balance
    weight_value: 1.0
    weight_group_label: induction_eqn

Trainer:
  Optimizer:
    optimizer: soap
    learning_rate: 0.001
  TrainerModules:
    - label: adaptive_grad_balance
      method_name: adaptive_grad_balance
      alpha: 0.1
      update_frequency: 1000

NN:
  type: feedforward
  hidden_layer_widths: [128, 128, 128]
  layer_types: siren
  activation_functions: siren
  init_weights: siren
  init_biases: all_zeros
  input_transformation: scale_linear
