Data:
  file_path:                ./testing_pinns/pinninit/examples/fluid_dynamics/cylinder_2d/data/raissi2019_cylinder_nektar_wake.mat
  train_sampling_strategy:  random
  num_train_samples:        5000
  train_sampling_seed:      12345

Collocation:
  from_file:                  0
  # file_path:                ./collocation/### Functionality to load from file so more reproducable
  collocation_strategy:       random
  num_collocation_points:     5000
  collocation_sampling_seed:  12345

Equations:
  equations:
    - label: velocity_from_psi
      function_name: velocity_from_psi_2d
      file_path: ./testing_pinns/pinninit/examples/fluid_dynamics/cylinder_2d/cylinder_2d_equations.py
      input_args:
        - psi
      output_args:
        - u
        - v
    - label: navier_stokes
      function_name: NS_residual_2d
      file_path: ./testing_pinns/pinninit/examples/fluid_dynamics/cylinder_2d/cylinder_2d_equations.py
      input_args:
        - u
        - v
        - p
        - l1
        - l2
      output_args:
        - residual_u
        - residual_v

Coordinates:
  coordinate_system:  cartesian
  coordinates:
    - label: t
      is_geometric: 0
    - label: x
      is_geometric: 1
      domain_lower_bound:   1
      domain_upper_bound:   8
  #   domain_boundary_conditions: periodic ###
    - label: y
      is_geometric: 1
      domain_lower_bound:  -2
      domain_upper_bound:   2
  #   domain_boundary_conditions: periodic ###
    ### example of fixed coord:
    ###- label: r
    ###  is_geometric: 1
    ###  is_fixed:     1
    ###  fixed_value:  20

Fields:
  input_fields:
    - label: u
    - label: v
  output_fields:
    - label: psi
    - label: p

Constants:
  #input_consts: ### Needed for physical consts or system consts
  #  - label:
  learnt_consts:
    - label: l1
    - label: l2

DataLoss:
  terms:
    - field_label:    u
      loss_function:  mse
      weight_method:  constant
      weight_value:   1.0
    - field_label:    v
      loss_function:  mse
      weight_method:  constant
      weight_value:   1.0
    #- label: boundary_u ### e.g. if we want to enforce boundary more strongly
    #  field: u
    #  weight_method: constant
    #  weight_value: 2.0

PhysicsLoss:
  terms:
    - label:          NS_u
      equation_label: navier_stokes
      residual:       residual_u
      loss_function:  mse
      weight_method:  constant
      weight_value:   1.0
    - label:          NS_v
      equation_label: navier_stokes
      residual:       residual_v
      loss_function:  mse
      weight_method:  constant
      weight_value:   1.0

Optimizer:
  optimizer:      adam
  learning_rate:  0.001

Layers:
  hidden_layer_widths:  [20, 20, 20, 20, 20, 20, 20, 20]
  layer_types:          all_linear ### Here (and similar below) we want to be able to have [linear, linear, other, ...] and all_* is alias
  activation_functions: all_tanh
  init_weights:         all_xavier
  init_biases:          all_zeros

Training:
  epochs: 500
