[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "C4"]
ignore = []

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
implicit_reexport = true
strict = true
