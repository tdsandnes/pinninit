name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # PyTorch with CUDA, in the environment and in pre-commit's mypy hook,
      # needs more space than the runner has free by default
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.11

      - name: Create environment
        run: conda env create -f environment.yml

      - name: Run pre-commit
        run: conda run -n pinninit pre-commit run --all-files

      - name: Run tests
        run: conda run -n pinninit pytest --maxfail=1 --disable-warnings -q
